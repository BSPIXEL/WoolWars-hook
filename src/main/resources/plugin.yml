name: WoolWarsHook
version: 1.0.0
main: cn.bspixel.woolwarshook
author: bsskddd,BSPIXEL
description: A hook for WoolWars
depend: [WoolWars]
api-version: 1.13

commands:
  config:
    description: Manage plugin configuration
    usage: /config [reload|info]
    permission: rww.admin
    permission-message: "&cYou don't have permission to use this command."

permissions:
  rww.admin:
    description: Allows managing plugin configuration
    default: op